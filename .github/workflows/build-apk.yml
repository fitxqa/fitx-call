name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: google-services.json (from secret, optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > android/app/google-services.json; fi
          if [ -f android/app/google-services.json ]; then echo "google-services.json found ✔"; else
            echo "::warning::android/app/google-services.json is missing — calls will NOT ring when the app is closed."; fi
          if grep -q PASTE_API_KEY www/firebase-config.js; then
            echo "::warning::www/firebase-config.js still has placeholders — the app will show 'Setup needed'."; fi

      - name: Signing key (from secrets)
        env:
          ALL: ${{ secrets.FITX_ALL }}
          KS: ${{ secrets.FITX_KEYSTORE_B64 }}
          KP: ${{ secrets.FITX_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ALL" ]; then
            J=$(printf '%s' "$ALL" | tr -d ' \n\r' | base64 -d)
            KS=$(printf '%s' "$J" | jq -r .keystoreB64); KP=$(printf '%s' "$J" | jq -r .keystorePassword)
            echo "::add-mask::$KP"
          fi
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::Add the FITX_ALL secret (Settings → Secrets and variables → Actions), then re-run."; exit 1; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/fitx-call.keystore"
          echo "FITX_KEYSTORE=$RUNNER_TEMP/fitx-call.keystore" >> "$GITHUB_ENV"
          echo "FITX_KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|e: |FAILURE|Could not|> " -A3 build.log | grep -v "^\s*at " | head -40 \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk FitX-Call.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitX-Call-apk
          path: FitX-Call.apk

      - name: Publish release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FitX Call 1.0.${{ github.run_number }}
          body: Download **FitX-Call.apk** on the phone and install it. Newer versions install over older ones.
          files: FitX-Call.apk
          make_latest: true
