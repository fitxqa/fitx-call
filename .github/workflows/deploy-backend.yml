name: Deploy backend (Firebase)

# Run manually: GitHub → Actions → "Deploy backend (Firebase)" → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Firebase credentials
        env:
          ALL: ${{ secrets.FITX_ALL }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AU: ${{ secrets.ADMIN_USERNAME }}
          AP: ${{ secrets.ADMIN_PASSWORD }}
          AN: ${{ secrets.ADMIN_NAME }}
        run: |
          if [ -n "$ALL" ]; then
            # Accept either the long line alone or the whole pasted file: pick the longest base64 line.
            C=$(printf '%s\n' "$ALL" | tr -d ' \r\t' | grep -oE '[A-Za-z0-9+/]{1000,}={0,2}' | awk '{ if (length($0) > length(m)) m=$0 } END { print m }')
            [ -z "$C" ] && C=$(printf '%s' "$ALL" | tr -d ' \n\r\t')
            echo "FITX_ALL key length: ${#C} characters (expected 5004)"
            if ! J=$(printf '%s' "$C" | base64 -d 2>/dev/null) || ! printf '%s' "$J" | jq -e . >/dev/null 2>&1; then
              echo "::error::FITX_ALL is ${#C} characters but should be 5004 — it was not copied completely. Delete it and paste the whole long line again."; exit 1; fi
            v=$(printf '%s' "$J" | jq -c '.serviceAccount // empty'); [ -n "$v" ] && SA="$v"
            v=$(printf '%s' "$J" | jq -r '.adminUsername // empty'); [ -n "$v" ] && AU="$v"
            v=$(printf '%s' "$J" | jq -r '.adminPassword // empty'); [ -n "$v" ] && AP="$v"
            v=$(printf '%s' "$J" | jq -r '.adminName // empty'); [ -n "$v" ] && AN="$v"
            echo "::add-mask::$AP"
          fi
          if [ -z "$SA" ] || [ "$SA" = "null" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Firebase key .json) first"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          { echo "ADMIN_USERNAME=$AU"; echo "ADMIN_PASSWORD=$AP"; echo "ADMIN_NAME=$AN"; } >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      - name: Install function packages
        working-directory: functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy security rules, indexes and functions
        run: |
          set -o pipefail
          if ! npx -y firebase-tools@latest deploy --only firestore,functions --project "$PROJECT_ID" --non-interactive --force 2>&1 | tee deploy.log; then
            grep -iE "error|denied|permission|billing|blaze|not been used|enable|failed" deploy.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Create first admin account
        working-directory: functions
        run: node create-admin.js
