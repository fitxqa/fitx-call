name: Deploy backend (Firebase)

# Run manually: GitHub → Actions → "Deploy backend (Firebase)" → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Firebase credentials
        env:
          ALL: ${{ secrets.FITX_ALL }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AU: ${{ secrets.ADMIN_USERNAME }}
          AP: ${{ secrets.ADMIN_PASSWORD }}
          AN: ${{ secrets.ADMIN_NAME }}
        run: |
          if [ -n "$ALL" ]; then
            J=$(printf '%s' "$ALL" | tr -d ' \n\r' | base64 -d)
            SA=$(printf '%s' "$J" | jq -c .serviceAccount)
            AU=$(printf '%s' "$J" | jq -r '.adminUsername // empty')
            AP=$(printf '%s' "$J" | jq -r '.adminPassword // empty'); echo "::add-mask::$AP"
            AN=$(printf '%s' "$J" | jq -r '.adminName // empty')
          fi
          if [ -z "$SA" ] || [ "$SA" = "null" ]; then echo "::error::Add the FITX_ALL secret first"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          { echo "ADMIN_USERNAME=$AU"; echo "ADMIN_PASSWORD=$AP"; echo "ADMIN_NAME=$AN"; } >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"

      - name: Install function packages
        working-directory: functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy security rules, indexes and functions
        run: npx -y firebase-tools@latest deploy --only firestore,functions --project "$PROJECT_ID" --non-interactive --force

      - name: Create first admin account
        working-directory: functions
        run: node create-admin.js
